<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sync Odds — SportyBet Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0D0505;color:#F5EEEE;font-family:system-ui,sans-serif;padding:20px;max-width:480px;margin:0 auto;}
h1{color:#F0C040;font-size:18px;margin-bottom:6px;}
p{font-size:12px;color:#9A7070;margin-bottom:20px;line-height:1.6;}
.btn{width:100%;padding:14px;border-radius:6px;background:#C41E1E;border:none;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:10px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:transparent;border:1.5px solid #3D2020;color:#9A7070;font-size:13px;font-weight:600;}
.log{background:#1A0A0A;border:1px solid #3D2020;border-radius:6px;padding:14px;font-size:11px;color:#9A7070;line-height:1.8;min-height:120px;margin-top:14px;white-space:pre-wrap;font-family:monospace;overflow-y:auto;max-height:400px;}
.ok{color:#27AE60;}
.err{color:#E8002D;}
.warn{color:#F0C040;}
.sports{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
.sport-chip{background:#1A0A0A;border:1.5px solid #3D2020;border-radius:6px;padding:8px 10px;font-size:11px;font-weight:600;color:#9A7070;cursor:pointer;text-align:center;}
.sport-chip.on{border-color:#F0C040;color:#F0C040;}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat{background:#1A0A0A;border:1px solid #3D2020;border-radius:6px;padding:10px;text-align:center;}
.stat-v{font-size:22px;font-weight:800;color:#F0C040;}
.stat-l{font-size:10px;color:#9A7070;margin-top:2px;}
</style>
</head>
<body>
<h1>⚡ Odds Sync</h1>
<p>Fetches real matches and odds from The Odds API via Supabase and saves to your database.</p>

<div class="stat-row">
  <div class="stat"><div class="stat-v" id="st-new">—</div><div class="stat-l">New Matches</div></div>
  <div class="stat"><div class="stat-v" id="st-upd">—</div><div class="stat-l">Updated</div></div>
  <div class="stat"><div class="stat-v" id="st-odds">—</div><div class="stat-l">Odds Synced</div></div>
</div>

<div class="sports" id="sport-list">
  <div class="sport-chip on" data-key="soccer_epl" data-league="Premier League" data-flag="🏴󠁧󠁢󠁥󠁮󠁧󠁿">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</div>
  <div class="sport-chip on" data-key="soccer_spain_la_liga" data-league="La Liga" data-flag="🇪🇸">🇪🇸 La Liga</div>
  <div class="sport-chip on" data-key="soccer_italy_serie_a" data-league="Serie A" data-flag="🇮🇹">🇮🇹 Serie A</div>
  <div class="sport-chip on" data-key="soccer_germany_bundesliga" data-league="Bundesliga" data-flag="🇩🇪">🇩🇪 Bundesliga</div>
  <div class="sport-chip on" data-key="soccer_france_ligue_one" data-league="Ligue 1" data-flag="🇫🇷">🇫🇷 Ligue 1</div>
  <div class="sport-chip on" data-key="soccer_uefa_champs_league" data-league="Champions League" data-flag="🏆">🏆 UCL</div>
</div>

<button class="btn" id="sync-btn" onclick="runSync()">🔄 Sync Now</button>
<button class="btn btn-secondary" onclick="window.location.href='/admin'">← Back to Admin</button>

<div class="log" id="log">Ready. Press Sync Now.</div>

<script>
const SUPA_URL = 'https://nmcdwmmfdrazmufodirq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tY2R3bW1mZHJhem11Zm9kaXJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODc0ODQsImV4cCI6MjEwMTM2MzQ4NH0.WA2IFshLUxmQ8C87dUhhAqOQggmvPttUqwl1IxVbOZk';
const ODDS_KEY = 'a1d378665ea009cd834637a70f80c1e6';

const { createClient } = supabase;
const db = createClient(SUPA_URL, SUPA_KEY);

document.querySelectorAll('.sport-chip').forEach(c => c.onclick = () => c.classList.toggle('on'));

const logEl = document.getElementById('log');
function log(msg, type='') {
  const d = document.createElement('div');
  d.className = type;
  d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ''; }
function setEl(id,v) { const e=document.getElementById(id); if(e) e.textContent=v; }

async function fetchOdds(sportKey) {
  // Use a CORS proxy to call The Odds API
  const target = `https://api.the-odds-api.com/v4/sports/${sportKey}/odds/?apiKey=${ODDS_KEY}&regions=eu,uk&markets=h2h,totals&oddsFormat=decimal&dateFormat=iso`;
  // Try corsproxy.io
  const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(target)}`;
  const res = await fetch(proxyUrl);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function runSync() {
  const btn = document.getElementById('sync-btn');
  btn.disabled = true; btn.textContent = '⏳ Syncing...';
  clearLog();

  const sports = [...document.querySelectorAll('.sport-chip.on')].map(c => ({
    key: c.dataset.key, league: c.dataset.league, flag: c.dataset.flag
  }));

  if(!sports.length) { log('No leagues selected.','err'); btn.disabled=false; btn.textContent='🔄 Sync Now'; return; }

  log(`Syncing ${sports.length} leagues via proxy...`);
  let newCount=0, updCount=0, oddsCount=0;

  for(const sport of sports) {
    log(`\n⏳ Fetching ${sport.league}...`);
    try {
      const games = await fetchOdds(sport.key);
      if(!Array.isArray(games)) { log(`⚠️ No data for ${sport.league}`,'warn'); continue; }
      log(`Found ${games.length} games`,'ok');

      for(const game of games) {
        const kickoff = new Date(game.commence_time);
        const diffHours = (kickoff - new Date()) / 3600000;
        const status = diffHours > 0 ? 'upcoming' : diffHours > -2 ? 'live' : 'finished';

        // Check existing
        const {data:ex} = await db.from('matches').select('id')
          .eq('home_team', game.home_team).eq('away_team', game.away_team)
          .gte('kick_off', new Date(kickoff.getTime()-3600000).toISOString())
          .lte('kick_off', new Date(kickoff.getTime()+3600000).toISOString())
          .maybeSingle();

        let matchId;
        if(ex) {
          await db.from('matches').update({status, league:sport.league, league_flag:sport.flag}).eq('id',ex.id);
          matchId = ex.id; updCount++;
        } else {
          const {data:nm} = await db.from('matches').insert({
            sport:'football', league:sport.league, league_flag:sport.flag,
            home_team:game.home_team, away_team:game.away_team,
            home_score:0, away_score:0, status,
            kick_off:game.commence_time, minute:0, is_featured:false,
            home_form:['W','D','W','L','W'], away_form:['L','W','D','W','L'],
          }).select().single();
          if(!nm) continue;
          matchId = nm.id; newCount++;
          log(`  ✅ ${game.home_team} vs ${game.away_team} (${status})`,'ok');
        }

        // Sync odds from first bookmaker
        for(const bm of (game.bookmakers||[]).slice(0,2)) {
          for(const mkt of (bm.markets||[])) {
            const mktType = mkt.key==='h2h'?'1x2':mkt.key==='totals'?'over_under':null;
            if(!mktType) continue;
            for(const outcome of mkt.outcomes) {
              let sel = '';
              if(mktType==='1x2') {
                if(outcome.name===game.home_team) sel='Home Win';
                else if(outcome.name===game.away_team) sel='Away Win';
                else sel='Draw';
              } else {
                sel = `${outcome.name} ${outcome.point||2.5}`;
              }
              const {data:eo} = await db.from('markets').select('id')
                .eq('match_id',matchId).eq('market_type',mktType).eq('selection',sel).maybeSingle();
              if(eo) { await db.from('markets').update({odds:outcome.price}).eq('id',eo.id); }
              else { await db.from('markets').insert({match_id:matchId,market_type:mktType,selection:sel,odds:outcome.price}); }
              oddsCount++;
            }
          }
        }
      }
    } catch(e) {
      log(`❌ ${sport.league}: ${e.message}`,'err');
    }
  }

  setEl('st-new', newCount);
  setEl('st-upd', updCount);
  setEl('st-odds', oddsCount);
  log(`\n✅ Done! ${newCount} new · ${updCount} updated · ${oddsCount} odds`,'ok');
  btn.disabled=false; btn.textContent='🔄 Sync Again';
}
</script>
</body>
</html>
