<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sync Odds — SportyBet Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0D0505;color:#F5EEEE;font-family:system-ui,sans-serif;padding:20px;max-width:480px;margin:0 auto;}
h1{color:#F0C040;font-size:18px;margin-bottom:6px;}
p{font-size:12px;color:#9A7070;margin-bottom:16px;line-height:1.6;}
.btn{width:100%;padding:14px;border-radius:6px;background:#C41E1E;border:none;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:10px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn2{background:transparent;border:1.5px solid #3D2020;color:#9A7070;font-size:13px;font-weight:600;}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat{background:#1A0A0A;border:1px solid #3D2020;border-radius:6px;padding:10px;text-align:center;}
.stat-v{font-size:22px;font-weight:800;color:#F0C040;}
.stat-l{font-size:10px;color:#9A7070;margin-top:2px;}
.log{background:#1A0A0A;border:1px solid #3D2020;border-radius:6px;padding:14px;font-size:11px;color:#9A7070;line-height:1.9;min-height:160px;margin-top:14px;font-family:monospace;overflow-y:auto;max-height:400px;}
.ok{color:#27AE60;}.err{color:#E8002D;}.warn{color:#F0C040;}
</style>
</head>
<body>
<h1>⚡ Odds Sync</h1>
<p>Calls your Supabase Edge Function which fetches real matches from The Odds API and saves them to your database.</p>

<div class="stat-row">
  <div class="stat"><div class="stat-v" id="st-new">—</div><div class="stat-l">New</div></div>
  <div class="stat"><div class="stat-v" id="st-upd">—</div><div class="stat-l">Updated</div></div>
  <div class="stat"><div class="stat-v" id="st-odds">—</div><div class="stat-l">Odds</div></div>
</div>

<button class="btn" id="sync-btn" onclick="runSync()">🔄 Sync Matches & Odds Now</button>
<button class="btn btn2" onclick="window.location.href='/admin'">← Back to Admin</button>

<div class="log" id="log">Press Sync to fetch real matches from The Odds API.</div>

<script>
const SUPA_URL = 'https://nmcdwmmfdrazmufodirq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tY2R3bW1mZHJhem11Zm9kaXJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODc0ODQsImV4cCI6MjEwMTM2MzQ4NH0.WA2IFshLUxmQ8C87dUhhAqOQggmvPttUqwl1IxVbOZk';

const logEl = document.getElementById('log');
function log(msg, cls='') { const d=document.createElement('div'); d.className=cls; d.textContent=msg; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
function setEl(id,v) { const e=document.getElementById(id); if(e) e.textContent=v; }

async function runSync() {
  const btn = document.getElementById('sync-btn');
  btn.disabled=true; btn.textContent='⏳ Syncing...';
  logEl.innerHTML='';
  log('Calling Supabase Edge Function...');

  try {
    const res = await fetch(`${SUPA_URL}/functions/v1/sync-odds`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPA_KEY}`,
      }
    });

    const data = await res.json();

    if(!res.ok || !data.success) {
      log('Error: ' + (data.error || 'Unknown error'), 'err');
      log('Edge Function may not be deployed yet. See instructions below.', 'warn');
      btn.disabled=false; btn.textContent='🔄 Try Again';
      return;
    }

    setEl('st-new', data.newCount);
    setEl('st-upd', data.updCount);
    setEl('st-odds', data.oddsCount);

    if(data.logs) data.logs.forEach(l => {
      const cls = l.startsWith('Added') ? 'ok' : l.startsWith('Error') ? 'err' : '';
      log(l, cls);
    });

    log('', '');
    log('✅ Sync complete!', 'ok');

  } catch(e) {
    log('Failed to reach Edge Function: ' + e.message, 'err');
    log('Make sure you have deployed the Edge Function. See steps below.', 'warn');
  }

  btn.disabled=false; btn.textContent='🔄 Sync Again';
}
</script>
</body>
</html>
