<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>SportyBet -- Your Bet, Your Rules</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        [data-theme="dark"] {
            --bg: #0B0E11;
            --surface: #14171C;
            --card: #1A1D24;
            --card2: #23272F;
            --border: #2A2E36;
            --border2: #363C46;
            --text: #E8EDF2;
            --text2: #8A9BB0;
            --muted: #6A7B8F;
            --primary: #E21B2D;
            --primary-hover: #F0263A;
            --input-bg: #23272F;
            --match-hover: #2A2E36;
            --shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        [data-theme="light"] {
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --card: #FFFFFF;
            --card2: #F1F3F4;
            --border: #E8EAED;
            --border2: #DADCE0;
            --text: #1A1D24;
            --text2: #5F6B7A;
            --muted: #8A9BB0;
            --primary: #E21B2D;
            --primary-hover: #F0263A;
            --input-bg: #FFFFFF;
            --match-hover: #F1F3F4;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        :root {
            --gold: #F0C040;
            --gold2: #E8A020;
            --odds: #FFFFFF;
            --odds-bg: rgba(255,255,255,.1);
            --live: #FF3333;
            --live-bg: rgba(255,51,51,.08);
            --blue: #2F80ED;
            --wa: #25D366;
            --r: 12px;
            --transition: all 0.2s ease;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            transition: var(--transition);
            padding-bottom: 80px;
        }

        button, input, select {
            font-family: 'Inter', sans-serif;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        @keyframes ticker {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        @keyframes winnersScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* HEADER */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
            cursor: pointer;
        }

        .logo-main {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .logo-main span {
            color: var(--gold);
        }

        .logo-sub {
            font-size: 8px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .hdr-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-btn {
            background: var(--card2);
            border: none;
            border-radius: 50%;
            padding: 8px;
            font-size: 16px;
            cursor: pointer;
            color: var(--text);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .theme-btn:hover {
            background: var(--border);
        }

        .btn-login {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text2);
            border-radius: var(--r);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-login:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-join {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--r);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-join:hover {
            background: var(--primary-hover);
        }

        .bal-chip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 6px 12px;
            font-size: 12px;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .bal-chip:hover {
            border-color: var(--primary);
        }

        .bal-chip strong {
            color: var(--gold);
        }

        /* SPORT NAV */
        .sport-nav-wrap {
            position: sticky;
            top: 73px;
            z-index: 150;
            background: var(--bg);
        }

        .sport-nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .sport-nav::-webkit-scrollbar {
            display: none;
        }

        .sp {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            flex-shrink: 0;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            background: var(--card2);
        }

        .sp:hover {
            background: var(--border);
        }

        .sp.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .sp .soon-tag {
            background: var(--gold);
            color: #000;
            font-size: 7px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 2px;
        }

        /* TICKER */
        .ticker {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            height: 32px;
            overflow: hidden;
        }

        .ticker-lbl {
            background: var(--primary);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 0 12px;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .ticker-body {
            overflow: hidden;
            flex: 1;
        }

        .ticker-inner {
            display: inline-block;
            white-space: nowrap;
            animation: ticker 40s linear infinite;
            font-size: 11px;
            color: var(--muted);
        }

        .ticker-hi {
            color: var(--text);
            font-weight: 600;
        }

        /* CONTENT */
        .content {
            padding: 16px 16px 80px;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, #8A0D1A 100%);
            border-radius: var(--r);
            padding: 24px 20px 20px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .hero-glow {
            position: absolute;
            right: -60px;
            top: -60px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240,192,64,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero h1 {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 8px;
            color: #fff;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .hero-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .btn-hero {
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: var(--r);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-hero:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(240,192,64,0.3);
        }

        .btn-hero2 {
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.8);
            border-radius: var(--r);
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-hero2:hover {
            background: rgba(255,255,255,0.1);
        }

        .hero-footer {
            display: flex;
            gap: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .hf-badge {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hf-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
        }

        .bonus-strip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            transition: var(--transition);
        }

        .bonus-strip:hover {
            border-color: var(--gold);
        }

        .bs-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .bs-btn {
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }

        .bs-btn:hover {
            transform: scale(1.05);
        }

        /* SECTION */
        .sec-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .sec-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sec-link {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
            cursor: pointer;
            transition: var(--transition);
        }

        .sec-link:hover {
            opacity: 0.8;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--primary);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .live-dot {
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite;
            flex-shrink: 0;
        }

        /* FEATURED MATCH */
        .featured-wrap {
            background: var(--surface);
            border-radius: var(--r);
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .feat-header {
            background: var(--primary);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feat-badge {
            font-size: 10px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feat-countdown {
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            background: rgba(0,0,0,0.2);
            padding: 3px 12px;
            border-radius: 20px;
        }

        .feat-body {
            padding: 16px;
        }

        .feat-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .ft-team {
            flex: 1;
            text-align: center;
        }

        .ft-team .ft-emoji {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .ft-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .ft-score {
            font-size: 32px;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
        }

        .ft-vs {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            padding: 0 12px;
        }

        .feat-meta {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .feat-events {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            background: var(--card2);
            border-radius: var(--r);
            margin-bottom: 12px;
        }

        .ev-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 10px;
            color: var(--text2);
        }

        .ev-chip.goal { border-color: rgba(39,174,96,0.3); color: #69F0AE; }
        .ev-chip.red { border-color: rgba(232,0,45,0.3); color: #FF6B6B; }
        .ev-chip.yellow { border-color: rgba(240,192,64,0.3); color: var(--gold); }
        .ev-chip.corner { border-color: rgba(47,128,237,0.3); color: #7EC8FF; }

        .feat-odds-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 12px;
        }

        .feat-odds-section .odd-btn {
            background: var(--card2);
            border: 1.5px solid var(--border);
            border-radius: var(--r);
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: var(--transition);
            min-height: 52px;
            justify-content: center;
        }

        .feat-odds-section .odd-btn:hover {
            border-color: var(--primary);
            background: var(--match-hover);
        }

        .feat-odds-section .odd-btn.sel {
            background: var(--gold);
            border-color: var(--gold);
        }

        .feat-odds-section .odd-btn.sel .odd-lbl {
            color: rgba(0,0,0,0.6);
        }
        .feat-odds-section .odd-btn.sel .odd-val {
            color: #000;
        }

        .feat-odds-section .odd-lbl {
            font-size: 9px;
            font-weight: 600;
            color: var(--text2);
            text-align: center;
            line-height: 1.2;
        }

        .feat-odds-section .odd-val {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
        }

        .feat-bottom {
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--card2);
        }

        .feat-min {
            font-size: 10px;
            color: var(--muted);
        }
        .feat-min strong {
            color: var(--gold);
        }

        .feat-share {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
        }

        .feat-share:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .feat-more-markets {
            padding: 8px 16px 16px;
            display: none;
        }

        .feat-more-markets.open {
            display: block;
        }

        .feat-more-markets .mkt-group {
            margin-bottom: 12px;
        }

        .feat-more-markets .mkt-title {
            font-size: 10px;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .feat-more-markets .odds-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .feat-more-markets .odds-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
        }

        .feat-more-markets .odd-btn {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--r);
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
            justify-content: center;
        }

        .feat-more-markets .odd-btn:hover {
            border-color: var(--primary);
        }

        .feat-more-markets .odd-btn.sel {
            background: var(--gold);
            border-color: var(--gold);
        }

        .feat-more-markets .odd-btn.sel .odd-lbl {
            color: rgba(0,0,0,0.6);
        }
        .feat-more-markets .odd-btn.sel .odd-val {
            color: #000;
        }

        .feat-more-markets .odd-lbl {
            font-size: 9px;
            font-weight: 600;
            color: var(--text2);
            text-align: center;
            line-height: 1.2;
        }

        .feat-more-markets .odd-val {
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
        }

        .btn-toggle-markets {
            display: block;
            width: 100%;
            padding: 10px;
            background: var(--card2);
            border: none;
            border-top: 1px solid var(--border);
            color: var(--text2);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .btn-toggle-markets:hover {
            background: var(--border);
            color: var(--text);
        }

        /* MATCH CARDS */
        .match-card-modern {
            background: var(--surface);
            border-radius: var(--r);
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .match-card-modern:hover {
            border-color: var(--primary);
        }

        .match-card-modern .league-hd {
            background: var(--card2);
            border-bottom: 1px solid var(--border);
            padding: 6px 14px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .match-card-modern .match-main {
            padding: 12px 14px;
        }

        .match-card-modern .match-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .match-time {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
        }

        .match-live-t {
            font-size: 11px;
            font-weight: 800;
            color: var(--live);
        }

        .match-actions-top {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-co {
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 9px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-co:hover {
            transform: scale(1.05);
        }

        .btn-stats {
            background: rgba(47,128,237,0.1);
            border: 1px solid rgba(47,128,237,0.2);
            color: var(--blue);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-stats:hover {
            background: rgba(47,128,237,0.15);
        }

        .btn-expand {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-expand:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        .match-card-modern .teams {
            margin-bottom: 10px;
        }

        .match-card-modern .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 0;
        }

        .match-card-modern .team-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .match-card-modern .team-sc {
            font-size: 14px;
            font-weight: 800;
            color: var(--live);
        }

        .match-card-modern .odds-section {
            margin-bottom: 4px;
        }

        .match-card-modern .odds-mkt-lbl {
            font-size: 9px;
            font-weight: 700;
            color: var(--text2);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
